# Local override: point the portal at the API running on the Docker host.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# Starts web-blue on host :3000. web-green stays off (Compose profile).
# Expects the File Portal API (be) on the host at http://localhost:8000
# (Poetry, or local Compose in the be repo).
#
# Do not use this file on the production server.

services:
  web-blue:
    environment:
      API_BASE_URL: http://host.docker.internal:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"

  web-green:
    profiles: ["green-slot"]
